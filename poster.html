<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL 2026 Countdown</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
    }

    body {
      background: linear-gradient(270deg,#000a1f,#001c58,#004ba0);
      background-size: 600% 600%;
animation: bgMove 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      
    }

    /* Fixed Container - Works perfectly on Mobile and PC */
    .aspect-ratio-box {
      width: 100%;
       /* Desktop size limit */
      aspect-ratio: 16 / 9;
      
      background: linear-gradient(270deg,#000a1f,#001c58,#004ba0);
      background-size: 600% 600%;
animation: bgMove 12s ease infinite;
      border-radius: 0px;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      
    }
@keyframes bgMove {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}


    /* Background Watermark */
    .watermark {
      position: absolute;
      font-size: 25px;
      font-weight: 700;
      margin-top: 21px;
      color: rgba(255, 255, 255, 0.04);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 10px;
    }

    .ipl-tag {
      color: #D1AB3E;
      letter-spacing: 3px;
      font-size: clamp(10px, 2vw, 18px);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      color: white;
      font-size: clamp(22px, 5.5vw, 55px);
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .match-info {
      background: #D1AB3E;
      color: #001c58;
      padding: 4px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: clamp(12px, 2.5vw, 22px);
      display: inline-block;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .timer {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(209, 171, 62, 0.3);
      padding: 12px 5px;
      border-radius: 10px;
      width: clamp(65px, 15vw, 120px); /* Responsive width */
      border-bottom: 3px solid #D1AB3E;
    }

    .number {
      font-size: clamp(24px, 5vw, 48px);
      font-weight: 700;
      color: white;
      display: block;
      line-height: 1;
    }

    .label {
      color: #cbd5e1;
      font-size: clamp(8px, 1.5vw, 12px);
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Decorative Ball */

  </style>
</head>
<body>

  <div class="aspect-ratio-box">
    <div class="watermark">WWW.CRICKETLIVE.SITE</div>
    
    <div class="content">
      <p class="ipl-tag">Final, ICC Women's T20 World Cup 2026</p>
      <h1>Engw vs Ausw</h1>
      <div class="match-info">05 July • 08:00 PM</div>
      
      <div class="timer">
        <div class="box">
          <span id="days" class="number">00</span>
          <div class="label">Days</div>
        </div>
        <div class="box">
          <span id="hours" class="number">00</span>
          <div class="label">Hours</div>
        </div>
        <div class="box">
          <span id="minutes" class="number">00</span>
          <div class="label">Mins</div>
        </div>
        <div class="box">
          <span id="seconds" class="number">00</span>
          <div class="label">Secs</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Target Date: March 28, 2026 at 7:30 PM IST
    const matchTime = new Date("March 28, 2026 19:30:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const diff = matchTime - now;

      if (diff <= 0) {
        document.querySelector(".timer").innerHTML = "<h2 style='color:#D1AB3E; font-size: 30px;'>MATCH STARTED!</h2>";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = d.toString().padStart(2, '0');
      document.getElementById("hours").innerText = h.toString().padStart(2, '0');
      document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
      document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
